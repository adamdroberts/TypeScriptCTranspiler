name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  linux:
    name: ${{ matrix.label }} build and tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux gcc
            cc: gcc
            cxx: g++
            extra-packages: ""
          - label: Linux clang
            cc: clang
            cxx: clang++
            extra-packages: clang
    env:
      TSC2C_CC: ${{ matrix.cc }}
      TSC2C_CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev libgmp-dev ${{ matrix.extra-packages }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run build

      - name: ECMAScript compliance matrix integrity
        run: bun run compliance:matrix

      - name: E2E no-GC suite
        run: TSC2C_NO_GC=1 bun tests/e2e/run.ts

      - name: Benchmark smoke
        run: bun run bench:smoke

  benchmark-long:
    name: Long benchmark policy
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libpcre2-dev libgmp-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Long benchmark threshold policy
        run: bun run bench:long

  compliance-integrity:
    name: Pinned ECMAScript compliance integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck compliance tooling
        run: bun run check:compliance-types

      - name: Test compliance contracts
        run: bun run compliance:self-test

      - name: Fetch and verify immutable pins
        run: bun run compliance:fetch

      - name: Verify independent clause catalog
        run: bun run compliance:catalog:check

      - name: Verify Test262 feature inventory
        run: bun run compliance:features:check

      - name: Verify matrix and pinned selectors
        run: bun tests/test262/check-matrix.ts --test262 cache/compliance/ecmascript-2026/test262
